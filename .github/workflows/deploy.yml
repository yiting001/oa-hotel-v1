name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build production package
        env:
          VITE_OA_TIME_ZONE: Asia/Shanghai
          VITE_OA_COMPANY_NAME: 东方饭店
          VITE_OA_PRODUCT_NAME: 企业协同办公
        run: npm run package:production

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key dist/oa-hotel-production.tar.gz \
            root@"$SSH_HOST":/tmp/oa-hotel-production.tar.gz
          scp -i ~/.ssh/deploy_key deploy/baota/deploy-remote.sh \
            root@"$SSH_HOST":/tmp/oa-hotel-deploy-remote.sh

      - name: Deploy on server
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          OA_DATABASE_URL: ${{ secrets.OA_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.OA_JWT_SECRET }}
        run: |
          ssh -i ~/.ssh/deploy_key root@"$SSH_HOST" \
            "OA_DATABASE_URL='$OA_DATABASE_URL' JWT_SECRET='$JWT_SECRET' bash /tmp/oa-hotel-deploy-remote.sh"

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://$SSH_HOST:52175/api/v1/health" >/dev/null 2>&1; then
              echo 'Health check passed'
              exit 0
            fi
            sleep 5
          done
          echo 'Health check failed' >&2
          exit 1
