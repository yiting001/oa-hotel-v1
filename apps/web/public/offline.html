<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>网络已断开 · 东方饭店 OA</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: flex;
        min-height: 100vh;
        margin: 0;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f7f8fa;
        color: #0a0a0a;
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      }
      main {
        width: min(100%, 360px);
        padding: 40px 28px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
      }
      .mark {
        display: inline-grid;
        width: 56px;
        height: 56px;
        place-items: center;
        color: #ffffff;
        background: #0a0a0a;
        border-radius: 50%;
        font-size: 26px;
        font-weight: 600;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        color: #5f5f5f;
        font-size: 14px;
        line-height: 1.6;
      }
      button {
        width: 100%;
        min-height: 44px;
        padding: 0 16px;
        color: #ffffff;
        background: #0a0a0a;
        border: 0;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">东</div>
      <h1>当前处于离线状态</h1>
      <p>页面已缓存，但审批数据需要联网获取。请检查网络连接后重试。</p>
      <button type="button" onclick="window.location.reload()">重新连接</button>
    </main>
  </body>
</html>
